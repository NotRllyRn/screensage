name: Build demo
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ScreenSage/**', 'Tests/**', 'companion/**', 'project.yml', 'scripts/**', '.github/workflows/**']
jobs:
  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r companion/requirements.txt
      - run: python -m unittest discover -s companion -v
  native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find required SDK
        run: |
          for app in /Applications/Xcode*.app; do
            if DEVELOPER_DIR="$app/Contents/Developer" xcrun --sdk iphoneos --show-sdk-version | grep -q '^27\.'; then
              echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo '::error::This runner has no iOS 27 SDK. Use an authorized Mac with Xcode 27; do not compile a capture stub for device release.'
          exit 1
      - run: brew install xcodegen
      - run: ./scripts/mac-build.sh
      - name: Unit tests
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS-27" in k for x in v if "iPhone" in x["name"]))')
          xcodebuild -project ScreenSage.xcodeproj -scheme ScreenSage -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/simulator -resultBundlePath build/Tests.xcresult CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenSage-demo
          path: |
            build/ScreenSage-unsigned.ipa
            build/SHA256SUMS
            build/Tests.xcresult
